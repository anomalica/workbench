                            officials declined to release the location and date of the incident.
                        - paragraph [ref=e150]: “Internationally, we are the most backward country in the world on this issue,”
                            Mr. Bigelow said in an interview. “Our scientists are scared of being ostracized, and our media
                            is scared of the stigma. China and Russia are much more open and work on this with huge organizations
