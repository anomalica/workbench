                        - paragraph [ref=e133]: “Why aren’t we spending more time and effort on this issue?” Mr. Elizondo
                            wrote in a resignation letter to Defense Secretary Jim Mattis.
                        - paragraph [ref=e134]: Mr. Elizondo said that the effort continued and that he had a successor, whom
