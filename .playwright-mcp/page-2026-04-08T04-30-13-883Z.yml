                        - paragraph [ref=e116]: WASHINGTON — In the $600 billion annual Defense Department budgets, the $22
                            million spent on the Advanced Aerospace Threat Identification Program was almost impossible to
                            find.
                        - paragraph [ref=e117]: Which was how the [Pentagon](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2020/07/23/us/politics/pentagon-ufo-harry-reid-navy.html)
                            wanted it.
                        - paragraph [ref=e118]: For years, the program investigated reports of unidentified flying objects,
                            according to Defense Department officials, interviews with program participants and records obtained
                            by The New York Times. It was run by a military intelligence official, Luis Elizondo, on the fifth
                            floor of the Pentagon’s C Ring, deep within the building’s maze.
                        - paragraph [ref=e119]: The Defense Department has never before acknowledged the existence of the
                            program, which it says it shut down in 2012. But its backers say that, while the [Pentagon](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2021/06/24/us/politics/ufo-report-us-pentagon.html)
                            ended funding for the effort at that time, the program remains in existence. For the past five
                            years, they say, officials with the program have continued to investigate episodes brought to
                            them by service members, while also carrying out their other Defense Department duties.
                        - paragraph [ref=e120]: The shadowy program — parts of it remain classified — began in 2007, and initially
                            it was largely funded at the request of Harry Reid, the Nevada Democrat who was the Senate majority
                            leader at the time and who has long had an interest in space phenomena. Most of the money went
                            to an aerospace research company run by a billionaire entrepreneur and longtime friend of Mr.
                            Reid’s, [Robert Bigelow](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2021/01/21/style/robert-bigelow-UFOs-life-after-death.html),
                            who is currently working with NASA to produce expandable craft for humans to use in space.
                        - paragraph [ref=e121]: "![](http://web.archive.org/web/20260117175252im_/https://static01.nyt.com/images/2017/12/17/us/politics/17dc-ufo4/merlin_112366280_2761622a-23fd-4aa1-86f5-655b1b60c458-articleLarge.jpg?quality=75&auto=webp&disable=upscale)"
                        - paragraph [ref=e122]: Working with Mr. Bigelow’s Las Vegas-based company, the program produced documents
                            that describe sightings of aircraft that seemed to move at very high velocities with no visible
                            signs of propulsion, or that hovered with no apparent means of lift.
                        - paragraph [ref=e123]: Officials with the program have also studied videos of encounters between
                            unknown objects and American military aircraft — including one released in August of a whitish
                            oval object, about the size of a commercial plane, chased by two Navy F/A-18F fighter jets from
                            the aircraft carrier Nimitz off the coast of San Diego in 2004.
                        - paragraph [ref=e124]: Mr. Reid, who retired from Congress this year, said he was proud of the program.
                            “I’m not embarrassed or ashamed or sorry I got this thing going,” Mr. Reid said in a recent interview
                            in Nevada. “I think it’s one of the good things I did in my congressional service. I’ve done something
                            that no one has done before.”
                        - paragraph [ref=e125]: Two other former senators and top members of a defense spending subcommittee
                            — Ted Stevens, an Alaska Republican, and Daniel K. Inouye, a Hawaii Democrat — also supported
                            the program. Mr. Stevens died in 2010, and Mr. Inouye in 2012.
                        - paragraph [ref=e126]: While not addressing the merits of the program, Sara Seager, an astrophysicist
                            at M.I.T., cautioned that not knowing the origin of an object does not mean that it is from another
                            planet or galaxy. “When people claim to observe truly unusual phenomena, sometimes it’s worth
                            investigating seriously,” she said. But, she added, “what people sometimes don’t get about science
                            is that we often have phenomena that remain unexplained.”
                        - paragraph [ref=e127]: "![](http://web.archive.org/web/20260117175252im_/https://static01.nyt.com/images/2017/12/16/autossell/UFO1/UFO1-videoSixteenByNine1050.jpg?auto=webp&quality=30&disable=upscale&format=pjpg)"
                        - paragraph [ref=e128]: James E. Oberg, a former NASA space shuttle engineer and the author of 10
                            books on spaceflight who often debunks [U.F.O. sightings](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2021/06/03/us/ufos-report.html),
                            was also doubtful. “There are plenty of prosaic events and human perceptual traits that can account
                            for these stories,” Mr. Oberg said. “Lots of people are active in the air and don’t want others
