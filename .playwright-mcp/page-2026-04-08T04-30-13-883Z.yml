                        - paragraph [ref=e145]: Contracts obtained by The Times show a congressional appropriation of just
                            under $22 million beginning in late 2008 through 2011. The money was used for management of the
                            program, research and assessments of the threat posed by the objects.
                        - paragraph [ref=e146]: The funding went to Mr. Bigelow’s company, Bigelow Aerospace, which hired
                            subcontractors and solicited research for the program.
                        - paragraph [ref=e147]: Under Mr. Bigelow’s direction, the company modified buildings in Las Vegas
                            for the storage of metal alloys and other materials that Mr. Elizondo and program contractors
                            said had been recovered from unidentified aerial phenomena. Researchers also studied people who
                            said they had experienced physical effects from encounters with the objects and examined them
                            for any physiological changes. In addition, researchers spoke to military service members who
                            had reported sightings of strange aircraft.
                        - paragraph [ref=e148]: “We’re sort of in the position of what would happen if you gave Leonardo da
                            Vinci a garage-door opener,” said Harold E. Puthoff, an engineer who has conducted research on
                            extrasensory perception for the C.I.A. and later worked as a contractor for the program. “First
                            of all, he’d try to figure out what is this plastic stuff. He wouldn’t know anything about the
                            electromagnetic signals involved or its function.”
                        - paragraph [ref=e149]: The program collected video and audio recordings of reported U.F.O. incidents,
                            including footage from a Navy F/A-18 Super Hornet showing an aircraft surrounded by some kind
