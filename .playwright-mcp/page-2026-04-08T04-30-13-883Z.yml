                        - paragraph [ref=e135]: "[U.F.O.s](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2021/06/24/us/politics/ufo-report-us-pentagon.html)
                            have been repeatedly investigated over the decades in the United States, including by the American
                            military. In 1947, the Air Force began a series of studies that investigated more than 12,000
                            claimed [U.F.O. sightings](http://web.archive.org/web/20260117175252/https://www.nytimes.com/2021/06/25/us/politics/pentagon-ufo-report.html)
                            before it was officially ended in 1969. The project, which included a study code-named Project
                            Blue Book, started in 1952, concluded that most sightings involved stars, clouds, conventional
                            aircraft or spy planes, although 701 remained unexplained."
                        - paragraph [ref=e136]: Robert C. Seamans Jr., the secretary of the Air Force at the time, said in
                            a memorandum announcing the end of Project Blue Book that it “no longer can be justified either
                            on the ground of national security or in the interest of science.”
                        - paragraph [ref=e137]: Mr. Reid said his interest in U.F.O.s came from Mr. Bigelow. In 2007, Mr.
