                        - paragraph [ref=e129]: Still, Mr. Oberg said he welcomed research. “There could well be a pearl there,”
                            he said.
                        - paragraph [ref=e130]: In response to questions from The Times, Pentagon officials this month acknowledged
                            the existence of the program, which began as part of the Defense Intelligence Agency. Officials
                            insisted that the effort had ended after five years, in 2012.
                        - paragraph [ref=e131]: “It was determined that there were other, higher priority issues that merited
                            funding, and it was in the best interest of the DoD to make a change,” a Pentagon spokesman, Thomas
